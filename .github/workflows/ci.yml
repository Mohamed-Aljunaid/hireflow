name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hireflow
          POSTGRES_PASSWORD: hireflow
          POSTGRES_DB: hireflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hireflow -d hireflow_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Enables the Postgres-only tests (migrations + LangGraph checkpointer).
      TEST_DATABASE_URL: postgresql+asyncpg://hireflow:hireflow@localhost:5432/hireflow_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check . ../evals
      - run: uv run ruff format --check . ../evals
      - run: uv run pytest -q
      - name: Eval harness tests (no LLM)
        working-directory: .
        run: uv run --project backend pytest evals -q
      - name: OpenAPI spec is up to date
        run: |
          uv run python -c "import json; from app.main import app; open('../docs/openapi.json','w').write(json.dumps(app.openapi(), indent=2))"
          git diff --exit-code -- ../docs/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Generated API types are up to date
        run: |
          npm run gen:api
          git diff --exit-code -- src/api/schema.ts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t hireflow-api ./backend
      - run: docker build -t hireflow-web ./frontend
