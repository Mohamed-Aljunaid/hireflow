services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hireflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hireflow}
      POSTGRES_DB: ${POSTGRES_DB:-hireflow}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    env_file: .env
    environment:
      # Inside compose the DB host is the service name, whatever .env says.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hireflow}:${POSTGRES_PASSWORD:-hireflow}@db:5432/${POSTGRES_DB:-hireflow}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Health check: see HEALTHCHECK in backend/Dockerfile.

  frontend:
    build: ./frontend
    environment:
      API_HOSTPORT: api:8000
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
