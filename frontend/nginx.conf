server {
    listen 80;
    root /usr/share/nginx/html;

    # /api/* -> the API service, prefix stripped (same as the Vite dev proxy).
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        client_max_body_size 6m;  # CV uploads (API limit: 5 MB)
    }

    location / {
        try_files $uri /index.html;
    }
}
